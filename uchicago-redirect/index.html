<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marko Medvedev &mdash; moved</title>
<link rel="canonical" href="https://marko-medvedev.github.io/" />
<meta http-equiv="refresh" content="0; url=https://marko-medvedev.github.io/" />
<meta name="robots" content="noindex, follow" />
<style>
  :root { --bg:#fdfdfb; --ink:#17191d; --muted:#6a7078; --accent:#1d4e79; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --ink:#e9e8e4; --muted:#949aa4; --accent:#8ab8e0; }
  }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Arial, sans-serif;
    line-height: 1.65; padding: 2rem;
  }
  main { max-width: 32rem; text-align: center; }
  h1 {
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-weight: 600; font-size: 1.9rem; letter-spacing: -.015em; margin: 0 0 .75rem;
  }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  a.go {
    display: inline-block; color: var(--accent); font-size: 1.05rem;
    border-bottom: 1px solid currentColor; text-decoration: none; padding-bottom: 1px;
  }
</style>
</head>
<body>
<main>
  <h1>Marko Medvedev</h1>
  <p>This page has moved. You are being redirected to my new homepage.</p>
  <p><a class="go" href="https://marko-medvedev.github.io/">marko-medvedev.github.io</a></p>
</main>
<script>window.location.replace("https://marko-medvedev.github.io/");</script>
</body>
</html>
